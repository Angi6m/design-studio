<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الطلبات | Design Studio</title>
    <link rel="stylesheet" href="Style.CSS">
    <style>
        body { font-family: sans-serif; background-color: #fcf8f5; padding: 20px; }
        .admin-container { max-width: 1300px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h1 { color: #d4a373; text-align: center; margin-bottom: 30px; }
        .orders-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 15px; }
        .orders-table th, .orders-table td { border: 1px solid #f1eae4; padding: 12px 10px; text-align: right; }
        .orders-table th { background-color: #f7ede2; color: #5c4d3c; font-weight: bold; }
        .orders-table tr:nth-child(even) { background-color: #fffbf7; }
        .orders-table tr:hover { background-color: #fdf5ed; }
        .loading { text-align: center; font-size: 18px; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>📦 لوحة إدارة طلبات العملاء</h1>
        
        <div id="loadingMessage" class="loading">جاري تحميل الطلبات من السيرفر... 🔄</div>

        <div class="admin-layout">

    <!-- القائمة الجانبية -->

    <aside class="sidebar">

        <div class="sidebar-header">

    <img src="IMAGE/IMAGElogo.jpeg" alt="Yazia Design">

    <h2>Yazia Design</h2>

    <p>Admin Dashboard</p>

</div>

        <button class="admin-tab active" data-tab="orders">
            📦 الطلبات
        </button>

        <button class="admin-tab" data-tab="services">
            🎨 الخدمات
        </button>

        <button class="admin-tab" data-tab="portfolio">
            🖼 معرض الأعمال
        </button>

        <button class="admin-tab" data-tab="pricing">
            💰 الأسعار
        </button>

        <button class="admin-tab" data-tab="reviews">
            ⭐ آراء العملاء
        </button>

        <button class="admin-tab" data-tab="settings">
            ⚙️ الإعدادات
        </button>

    </aside>


    <!-- محتوى الصفحة -->

    <main class="admin-content">

        <section id="orders" class="tab-content active">

            <!-- هنا نحط جدول الطلبات الحالي -->

        </section>

        <section id="services" class="tab-content">

        </section>

        <section id="portfolio" class="tab-content">
            <h2>🖼 إدارة صور الخدمات</h2>

<div class="portfolio-admin">

    <label>الخدمة</label>

    <select id="serviceType">

        <option value="identity">الهوية البصرية</option>
        <option value="social">إدارة حسابات التواصل</option>
        <option value="posts">تصميم البوستات</option>
        <option value="other">خدمات أخرى</option>

    </select>

    <label>اختر الصور</label>

    <input
        type="file"
        id="portfolioImages"
        accept="image/*"
        multiple
    >

    <button id="uploadPortfolioBtn">
        رفع الصور
    </button>

</div>

<hr>

<div id="portfolioGallery"></div>

        </section>

        <section id="pricing" class="tab-content">

        </section>

        <section id="reviews" class="tab-content">

        </section>

        <section id="settings" class="tab-content">

        </section>

    </main>

</div>
        
        <table class="orders-table" id="ordersTable" style="display: none;">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>رقم الواتساب</th>
                    <th>الباقة المختارة</th> <th>السعر</th> <th>الصورة المرفقة</th>
                    <th>تفاصيل الطلب</th>
                    <th>وقت الإرسال</th>
                    <th>إجراءات</th> 
                </tr>
            </thead>
            <tbody id="ordersContainer">
                </tbody>
        </table>
    </div>

    <script type="module" src="admin.js"></script>
    <script type="module" src="portfolio.js"></script>
</body>
</html>
